version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
    open-pull-requests-limit: 10
    assignees:
      - joel1di1
    labels:
      - dependencies
      - ruby
    # One weekly PR for all minor and patch bumps; majors stay separate.
    groups:
      bundler-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
    open-pull-requests-limit: 10
    assignees:
      - joel1di1
    labels:
      - dependencies
      - github-actions
    # One weekly PR for all minor and patch bumps; majors stay separate.
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
