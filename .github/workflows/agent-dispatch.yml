name: Agent dispatch

# Safety net for agent.yml: serves a session still waiting in the self-hosted environment's
# queue (lost lease, failed runner, session started from the Console). One session per run;
# GitHub may delay scheduled runs.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: agent-dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      stale: ${{ steps.stats.outputs.stale }}
    steps:
      - name: Install ant
        run: |
          curl -fsSL "https://github.com/anthropics/anthropic-cli/releases/download/v1.38.0/ant_1.38.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin ant

      # Sessions queued for less than 10 minutes are left to the agent.yml run that created them.
      - name: Queue depth
        id: stats
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENVIRONMENT_ID: ${{ vars.ENVIRONMENT_ID }}
        run: |
          stats=$(ant beta:environments:work stats --environment-id "$ENVIRONMENT_ID" --format json)
          echo "$stats"
          stale=$(jq -r '.depth > 0 and .oldest_queued_at != null and
            (now - (.oldest_queued_at | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601) > 600)' <<<"$stats")
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

  sandbox:
    needs: check
    if: needs.check.outputs.stale == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/agent-sandbox.yml
    secrets:
      ANTHROPIC_ENVIRONMENT_KEY: ${{ secrets.ANTHROPIC_ENVIRONMENT_KEY }}
      AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
