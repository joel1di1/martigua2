name: 'Agent: issue/PR label'

# Labels drive the agent (the full list is in config/managed_agents/setup.sh). Adding
# `agent:refine` to an issue starts its refinement, and `agent:dev` its implementation, or,
# on a pull request, a session that addresses the feedback on it. The trigger
# label is replaced with `agent:queued` right away, and with `agent:stuck` if the session
# cannot be started. The session's tools run in this workflow's runner (agent-sandbox.yml).
# See config/managed_agents/.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

# Only triggers share the per-issue group: other labels (the agent's status changes
# included) would otherwise queue behind the running session, then replace a pending trigger.
concurrency:
  group: >-
    ${{
      (github.event.sender.login == github.repository_owner &&
       ((github.event_name == 'issues' && contains(fromJSON('["agent:refine", "agent:dev"]'), github.event.label.name)) ||
        (github.event_name == 'pull_request' && github.event.label.name == 'agent:dev' &&
         github.event.pull_request.head.repo.full_name == github.repository)))
      && format('agent-{0}', github.event.issue.number || github.event.pull_request.number)
      || format('agent-ignored-{0}', github.run_id)
    }}

jobs:
  start:
    # Public repo: only the owner can spend agent budget. Fork PRs get no secrets.
    if: >-
      github.event.sender.login == github.repository_owner &&
      ((github.event_name == 'issues' && contains(fromJSON('["agent:refine", "agent:dev"]'), github.event.label.name)) ||
       (github.event_name == 'pull_request' && github.event.label.name == 'agent:dev' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - name: Mark as queued
        run: script/managed_agents/set_status.sh "$NUMBER" agent:queued

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - run: gem install anthropic --no-document

      - name: Start session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_ID: ${{ vars.AGENT_ID }}
          ENVIRONMENT_ID: ${{ vars.ENVIRONMENT_ID }}
          VAULT_ID: ${{ vars.VAULT_ID }}
          WORKSPACE_ID: ${{ vars.WORKSPACE_ID }}
          LABEL: ${{ github.event.label.name }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            mode=--pr
          elif [ "$LABEL" = "agent:refine" ]; then
            mode=--refine
          else
            mode=--implement
          fi
          ruby script/managed_agents/start_session.rb "$mode" "$NUMBER" | tee session.txt

      - name: Acknowledge
        # The session runs anyway: a failed comment must not mark it as stuck.
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMBER" --body "🤖 Agent session started: $(grep -o 'https://[^ ]*' session.txt) (runner: $RUN_URL)"

      - name: Mark as stuck
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          script/managed_agents/set_status.sh "$NUMBER" agent:stuck
          gh issue comment "$NUMBER" --body "🤖 Could not start the agent session ($RUN_URL)."

  sandbox:
    needs: start
    permissions:
      contents: read
    uses: ./.github/workflows/agent-sandbox.yml
    with:
      wait: 300
    secrets:
      ANTHROPIC_ENVIRONMENT_KEY: ${{ secrets.ANTHROPIC_ENVIRONMENT_KEY }}
      AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
