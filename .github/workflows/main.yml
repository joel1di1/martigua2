# Keep the name `CI` and the push trigger on every branch: agent-ci-fix.yml
# listens to `workflow_run` of this workflow by name.
name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

# A newer push on the same branch cancels the run in progress, except on main
# where every commit gets a full run. Cancelled runs conclude as `cancelled`,
# not `failure`, so they don't start agent-ci-fix.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  brakeman:
    name: Brakeman Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Static analysis only: bin/brakeman doesn't load the app, so no libvips.
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities with Brakeman
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # bin/importmap boots the app, which loads ruby-vips.
      - name: Install libvips
        uses: ./.github/actions/install-libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint with RuboCop
        run: bin/rubocop

  qlty:
    name: Qlty (code quality report)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: a Qlty install or plugin error must not turn main red.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install Qlty
        uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2

      # Informational: --no-fail keeps existing findings from failing CI,
      # which would trigger agent-ci-fix.yml. Drop it once the backlog is clean.
      - name: Qlty check
        run: qlty check --all --no-fail

      - name: Qlty maintainability metrics
        run: qlty metrics --all --max-depth=2 --sort complexity --limit 20

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Qlty coverage upload via OIDC (tokenless)
    services:
      postgres:
        # Same major version as production (PostgreSQL 16).
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # ruby-vips (Active Storage image variants) needs libvips to load.
      # The runner image already ships Google Chrome, so it isn't reinstalled.
      - name: Install libvips
        uses: ./.github/actions/install-libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          bundler-cache: true

      - name: Set up chromedriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c # v3

      - name: Assets Precompile
        run: bundle exec rake assets:precompile

      # No DATABASE_URL: it would send every process to the same database.
      # config/database.yml reads POSTGRES_HOST/POSTGRES_PORT and suffixes the
      # test database with TEST_ENV_NUMBER, so each process gets its own.
      - name: Create the test databases
        run: bin/rails parallel:create parallel:load_schema
        env:
          RAILS_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      # One process per CPU (parallel_tests' default).
      - name: Run the tests
        run: bin/parallel_rspec spec --serialize-stdout --combine-stderr --verbose-rerun-command
        env:
          RAILS_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          # simplecov (spec_helper.rb) merges the parallel workers; only main is measured.
          COVERAGE: ${{ github.ref == 'refs/heads/main' }}

      # Informational: needs the repo to be added on qlty.sh; must not turn main red.
      - name: Upload coverage to Qlty
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2
        with:
          oidc: true
          files: coverage/.resultset.json
