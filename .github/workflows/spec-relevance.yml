name: Spec relevance

# Runs the PR's changed spec files against the base branch code. If a changed
# spec already passes there, the job fails to flag it as possibly irrelevant.
# This check is advisory: do NOT add it to the required checks for merging,
# since adding specs for pre-existing behavior is legitimate.

on:
  pull_request:

permissions:
  contents: read

# A newer push on the same PR cancels the check in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spec_relevance:
    name: Spec relevance
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as production (PostgreSQL 16).
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: martigua2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Without libvips, ruby-vips fails to load, every spec errors at load and
      # bin/check-spec-relevance counts that as "relevant": the check would
      # always pass without checking anything.
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Fails the job if the app can't boot, instead of letting load errors
      # pass as "relevant" specs.
      - name: Check that the app boots
        run: |
          bin/rails runner 'puts "App booted (Rails #{Rails.version}, #{Rails.env})"'
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/martigua2_test

      # The runner image already ships Google Chrome (needed if changed specs
      # include system specs); only chromedriver is set up.
      - name: Set up chromedriver
        uses: nanasess/setup-chromedriver@v3

      - name: Check spec relevance
        run: bin/check-spec-relevance "origin/${{ github.base_ref }}"
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/martigua2_test
